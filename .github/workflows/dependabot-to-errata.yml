# hollaco-playbook: security v5
name: Dependabot to Errata Issue

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * *'  # 13:00 UTC daily — catches CVEs disclosed against existing deps

# Note: GITHUB_TOKEN cannot read Dependabot alerts, and issues it creates do
# not trigger downstream workflows. Both reads and writes use ERRATA_BOT_PAT
# (a fine-grained PAT with "Dependabot alerts: Read" and "Issues: Read & Write").

permissions:
  contents: read

jobs:
  open-issues-for-high-critical:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ERRATA_BOT_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - name: Fetch open high/critical Dependabot alerts
        id: alerts
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            "/repos/$REPO/dependabot/alerts?state=open&severity=high,critical&per_page=100" \
            > alerts.json
          count=$(jq 'length' alerts.json)
          echo "Found $count open high/critical alert(s)"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Open issue for each alert (idempotent on GHSA)
        if: steps.alerts.outputs.count != '0'
        run: |
          set -euo pipefail
          opened=0
          skipped=0
          while IFS= read -r alert; do
            ghsa=$(jq -r '.security_advisory.ghsa_id'                              <<<"$alert")
            severity=$(jq -r '.security_advisory.severity'                          <<<"$alert")
            pkg=$(jq -r '.security_vulnerability.package.name'                      <<<"$alert")
            ecosystem=$(jq -r '.security_vulnerability.package.ecosystem'           <<<"$alert")
            current=$(jq -r '.security_vulnerability.vulnerable_version_range'      <<<"$alert")
            fixed=$(jq -r '.security_vulnerability.first_patched_version.identifier // "unknown"' <<<"$alert")
            summary=$(jq -r '.security_advisory.summary'                            <<<"$alert")
            url=$(jq -r '.html_url'                                                 <<<"$alert")

            # Idempotency: skip if any existing issue (open or closed) references this GHSA.
            existing=$(gh issue list --repo "$REPO" --state all \
              --search "$ghsa in:title,body" \
              --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "Skip $ghsa — issue #$existing already references it"
              skipped=$((skipped + 1))
              continue
            fi

            title="[Errata] $severity CVE in \`$pkg\` ($ecosystem) — $ghsa"
            {
              printf '**Package:** `%s` (%s)\n' "$pkg" "$ecosystem"
              printf '**Severity:** %s\n' "$severity"
              printf '**Vulnerable range:** %s\n' "$current"
              printf '**First patched version:** %s\n' "$fixed"
              printf '**Advisory:** [%s](%s)\n\n' "$ghsa" "$url"
              printf '%s\n\n' "$summary"
              printf -- '---\n'
              printf 'Filed automatically by `.github/workflows/dependabot-to-errata.yml`. '
              printf 'The `security` label triggers `file-errata.yml`, which opens a matching '
              printf 'Errata work item in Azure DevOps and links back here.\n'
            } > body.md

            gh issue create --repo "$REPO" \
              --title "$title" \
              --body-file body.md \
              --label security \
              --label cve \
              --label dependency
            opened=$((opened + 1))
          done < <(jq -c '.[]' alerts.json)

          echo "Opened: $opened · Skipped (already filed): $skipped"

  reconcile-resolved-alerts:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ERRATA_BOT_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - name: Fetch GHSAs for all still-open alerts
        id: open
        run: |
          set -euo pipefail
          # No severity filter here (the opener job filters to high/critical, but the
          # reconcile set is membership-only): if an alert is still open at ANY severity
          # — including one reclassified down from high — its GHSA must stay in the set so
          # we don't close a still-vulnerable errata. The set means "fixed or dismissed".
          gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            "/repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            > open-alerts.json
          # One GHSA id per line; empty file if none.
          jq -r '.[].security_advisory.ghsa_id' open-alerts.json | sort -u > open-ghsas.txt
          echo "Currently open GHSAs:"; cat open-ghsas.txt || true

      - name: Close [Errata] issues whose GHSA is no longer open
        run: |
          set -euo pipefail
          # Only bot-filed Dependabot errata carry the 'dependency' label.
          gh issue list --repo "$REPO" --state open --label dependency \
            --limit 1000 \
            --json number,title --jq '.[] | [.number, .title] | @tsv' > open-issues.tsv
          closed=0; kept=0
          while IFS=$'\t' read -r number title; do
            [ -z "${number:-}" ] && continue
            ghsa=$(printf '%s' "$title" | grep -oE 'GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}' || true)
            if [ -z "$ghsa" ]; then
              echo "Issue #$number: no GHSA in title; skipping."
              kept=$((kept + 1))
              continue
            fi
            if grep -qxF "$ghsa" open-ghsas.txt; then
              echo "Issue #$number ($ghsa): alert still open; keeping."
              kept=$((kept + 1))
            else
              echo "Issue #$number ($ghsa): alert resolved/dismissed; closing."
              gh issue comment "$number" --repo "$REPO" \
                --body "Dependabot alert \`$ghsa\` is no longer open (fix merged or alert dismissed). Closing this errata automatically; the linked Azure DevOps work item will auto-resolve."
              gh issue close "$number" --repo "$REPO" --reason completed
              closed=$((closed + 1))
            fi
          done < open-issues.tsv
          echo "Reconcile complete — closed: $closed · kept: $kept"
